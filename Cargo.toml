[package]
name = "d2l-class-manager"
version = "0.1.0"
edition = "2021"
authors = ["LeeOs <lmb@local>"]
description = "High-performance Rust CLI data getter, content downloader, and AI reconciliation layer for D2L Brightspace / CourseLink"

[[bin]]
name = "d2l"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"

# CLI Parsing & Output
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7.1"
colored = "2.1"

# HTTP & Network Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialization & Chrono
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# System Paths & Files
dirs = "5.0"
regex = "1.10"
anyhow = "1.0"
thiserror = "1.0"
base64 = "0.22"

# HTML to Text (for reading posts & announcement cleanup)
html2text = "0.17"

# Chrome DevTools Protocol for SSO / Bearer Interception
chromiumoxide = { version = "0.9.1", default-features = false }

[dev-dependencies]
tempfile = "3.12"
